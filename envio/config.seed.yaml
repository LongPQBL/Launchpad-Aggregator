# One-off Envio Cloud deployment that discovers Pons launches and their related pools.
# The app imports SeededPool from this deployment's GraphQL endpoint after it catches up.
# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: pons-pool-seed
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: PonsV1LegacyFactory
    handler: src/EventHandlersSeed.ts
    events:
      - event: "TokenLaunched(address indexed token, address indexed deployer, address indexed dexFactory, address pairToken, address pool, uint256 dexId, uint256 launchConfigId, uint256 positionId, uint256 restrictionsEndBlock, uint256 initialBuyAmount)"
  - name: PonsV1ActiveFactory
    handler: src/EventHandlersSeed.ts
    events:
      - event: "TokenLaunched(address indexed token, address indexed deployer, address indexed dexFactory, address pairToken, address pool, uint256 dexId, uint256 launchConfigId, uint256 positionId, uint256 restrictionsEndBlock, uint256 initialBuyAmount)"
  - name: PonsV2Factory
    handler: src/EventHandlersSeed.ts
    events:
      - event: "TokenLaunched(address indexed token, address indexed curve, address indexed deployer, address pairToken, uint256 launchConfigId, uint256 graduationThreshold)"
        name: TokenLaunchedV2
  - name: UniswapV3Factory
    handler: src/EventHandlersSeed.ts
    events:
      - event: "PoolCreated(address indexed token0, address indexed token1, uint24 indexed fee, int24 tickSpacing, address pool)"
  - name: UniswapV2Factory
    handler: src/EventHandlersSeed.ts
    events:
      - event: "PairCreated(address indexed token0, address indexed token1, address pair, uint256)"
  - name: UniswapV4PoolManager
    handler: src/EventHandlersSeed.ts
    events:
      - event: "Initialize(bytes32 indexed id, address indexed currency0, address indexed currency1, uint24 fee, int24 tickSpacing, address hooks, uint160 sqrtPriceX96, int24 tick)"
chains:
  - id: 4663
    hypersync_config:
      url: https://robinhood.hypersync.xyz
    start_block: 8600612
    # Robinhood Chain head observed via eth_blockNumber on 2026-11-11.
    end_block: 111584773
    contracts:
      - name: PonsV1LegacyFactory
        address: ["0x0c37a24F5D23A486FA692d1500881d698B1F77a4"]
      - name: PonsV1ActiveFactory
        start_block: 8991118
        address: ["0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB"]
      - name: PonsV2Factory
        start_block: 26841846
        address: ["0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e"]
      - name: UniswapV3Factory
        address: ["0x1f7d7550b1b028f7571e69a784071f0205fd2efa"]
      - name: UniswapV2Factory
        address: ["0x8bceaa40b9acdfaedf85adf4ff01f5ad6517937f"]
      - name: UniswapV4PoolManager
        address: ["0x8366a39cC670b4001a1121b8f6A443A643E40951"]
