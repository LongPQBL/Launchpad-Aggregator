name: pons-envio-cloud-seeded-window-1
field_selection:
  transaction_fields:
  - hash
  - from
contracts:
- name: PonsV1LegacyFactory
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: TokenLaunched(address indexed token, address indexed deployer, address indexed dexFactory, address pairToken, address
      pool, uint256 dexId, uint256 launchConfigId, uint256 positionId, uint256 restrictionsEndBlock, uint256 initialBuyAmount)
- name: PonsV1ActiveFactory
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: TokenLaunched(address indexed token, address indexed deployer, address indexed dexFactory, address pairToken, address
      pool, uint256 dexId, uint256 launchConfigId, uint256 positionId, uint256 restrictionsEndBlock, uint256 initialBuyAmount)
- name: PonsV3Pool
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: Swap(address indexed sender, address indexed recipient, int256 amount0, int256 amount1, uint160 sqrtPriceX96, uint128
      liquidity, int24 tick)
- name: PonsV2Factory
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: TokenLaunched(address indexed token, address indexed curve, address indexed deployer, address pairToken, uint256
      launchConfigId, uint256 graduationThreshold)
    name: TokenLaunchedV2
  - event: LaunchSwept(address indexed token, uint256 quoteOut, uint256 tokenOut)
  - event: PoolGraduated(address indexed token, uint256 positionId, uint256 tokenAmount, uint256 pairTokenAmount)
  - event: LaunchGraduationRescued(address indexed token, address indexed recipient, uint256 quoteAmount, uint256 tokenAmount)
- name: PonsV2Curve
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: CurveBuy(address indexed buyer, address indexed recipient, uint256 quoteIn, uint256 tokensOut, uint256 fee, uint256
      tax)
  - event: CurveSell(address indexed seller, address indexed recipient, uint256 tokensIn, uint256 quoteOut, uint256 fee, uint256
      tax)
  - event: BuybackLocked(uint256 quoteSpent, uint256 tokensLocked)
- name: UniswapV4PoolManager
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: Initialize(bytes32 indexed id, address indexed currency0, address indexed currency1, uint24 fee, int24 tickSpacing,
      address hooks, uint160 sqrtPriceX96, int24 tick)
  - event: Swap(bytes32 indexed id, address indexed sender, int128 amount0, int128 amount1, uint160 sqrtPriceX96, uint128
      liquidity, int24 tick, uint24 fee)
    name: V4Swap
- name: UniswapV3Factory
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: PoolCreated(address indexed token0, address indexed token1, uint24 indexed fee, int24 tickSpacing, address pool)
- name: UniswapV3Pool
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: Swap(address indexed sender, address indexed recipient, int256 amount0, int256 amount1, uint160 sqrtPriceX96, uint128
      liquidity, int24 tick)
    name: V3Swap
- name: UniswapV2Factory
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: PairCreated(address indexed token0, address indexed token1, address pair, uint256)
- name: UniswapV2Pair
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: Swap(address indexed sender, uint256 amount0In, uint256 amount1In, uint256 amount0Out, uint256 amount1Out, address
      indexed to)
    name: V2Swap
  - event: Sync(uint112 reserve0, uint112 reserve1)
    name: V2Sync
- name: ChainlinkAggregator
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: AnswerUpdated(int256 indexed current, uint256 indexed roundId, uint256 updatedAt)
- name: ChainlinkFeedProxy
  handler: src/EventHandlersSeededWindow1.ts
  events:
  - event: AggregatorConfirmed(address indexed previous, address indexed latest)
