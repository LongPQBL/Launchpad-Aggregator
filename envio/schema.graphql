type RawLaunch {
  id: ID!
  chainId: Int!
  tokenAddress: String!
  deployerAddress: String!
  pairTokenAddress: String!
  poolAddress: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}

type RawSwap {
  id: ID!
  chainId: Int!
  poolAddress: String!
  sender: String!
  recipient: String!
  amount0: BigInt!
  amount1: BigInt!
  sqrtPriceX96: BigInt!
  liquidity: BigInt!
  tick: Int!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
  timestamp: Int!
}
