type RawLaunch {
  id: ID!
  chainId: Int!
  tokenAddress: String!
  deployerAddress: String!
  pairTokenAddress: String!
  poolAddress: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}

type RawSwap {
  id: ID!
  chainId: Int!
  poolAddress: String!
  sender: String!
  recipient: String!
  # The transaction's originating EOA (tx.from), not the Swap event's own `sender` param — on a
  # router-mediated swap `sender` is typically the router contract, not the wallet that traded. See
  # be/src/domain/types.ts's Trade.traderAddress doc comment for the same distinction.
  txFrom: String!
  amount0: BigInt!
  amount1: BigInt!
  sqrtPriceX96: BigInt!
  liquidity: BigInt!
  tick: Int!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
  timestamp: Int!
}

type RawLaunchV2 {
  id: ID!
  chainId: Int!
  tokenAddress: String!
  curveAddress: String!
  deployerAddress: String!
  pairTokenAddress: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}

type RawLifecycleTransition {
  id: ID!
  chainId: Int!
  tokenAddress: String!
  phase: Int!
  kind: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}

type RawCurveTrade {
  id: ID!
  chainId: Int!
  curveAddress: String!
  side: String!
  tokenAmountRaw: BigInt!
  quoteAmountRaw: BigInt!
  feeRaw: BigInt!
  taxRaw: BigInt!
  txFrom: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
  timestamp: Int!
}

type RawCurveBuyback {
  id: ID!
  chainId: Int!
  curveAddress: String!
  quoteSpentRaw: BigInt!
  tokensLockedRaw: BigInt!
  # BuybackLocked has no buyer/trader param at all — this is the transaction's originating EOA
  # (tx.from), the same provenance RawCurveTrade.txFrom uses, not a made-up value.
  txFrom: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
  timestamp: Int!
}

type RawV4Initialize {
  id: ID!
  chainId: Int!
  poolId: String!
  currency0: String!
  currency1: String!
  fee: Int!
  tickSpacing: Int!
  hooks: String!
  sqrtPriceX96: BigInt!
  tick: Int!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}
