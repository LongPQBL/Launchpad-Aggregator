# Each Raw* entity below carries the same (chainId, blockNumber, logIndex) index: be/src/envioSync's
# incrementalPage.ts reads every stream as a bounded (chainId, blockNumber, logIndex, id) keyset page
# (docs/superpowers/specs/2026-10-05-envio-near-realtime-sync-design.md), which this index supports —
# `id`'s own index already exists as the primary key. Added through this schema (a supported Envio
# migration that builds the index in the background before future reads need it), not live DDL against
# Envio's managed Postgres.
# Lookup set of every token address launched on Pons (V1 or V2), written alongside RawLaunch/
# RawLaunchV2 at TokenLaunched time. Used only to decide, at Uniswap V3/V2 pool-creation and V4
# pool-Initialize time, whether a pool is worth tracking at all — see RelevantV4Pool below and the
# contractRegister/Initialize handlers in EventHandlers.ts. Not itself raw evidence of anything.
type KnownLaunchToken {
  id: ID! # `${chainId}-${tokenAddress}`, lowercase
  chainId: Int!
  tokenAddress: String!
}

# V4 has no per-pool contract to selectively watch (all pools share one PoolManager address), and
# its Swap event carries only `id`/`sender`, not currency0/currency1 — so there is no way to decide
# "is this swap worth keeping" from the Swap event alone. This entity records, at Initialize time
# (when currency0/currency1 ARE known), which poolIds matched a KnownLaunchToken; the V4Swap handler
# checks membership here before writing RawV4Swap, instead of keeping every V4 pool's full swap
# history on a chain shared with unrelated Uniswap activity.
type RelevantV4Pool {
  id: ID! # `${chainId}-${poolId}`, lowercase
  chainId: Int!
  poolId: String!
}

# Same purpose as RelevantV4Pool, for V3/V2: their Swap/Sync events are emitted by the pool/pair's
# own contract address and never carry token0/token1 either, so relevance (decided at PoolCreated/
# PairCreated time, when the tokens ARE known) is recorded here keyed by that address and checked
# before writing RawV3Swap/RawV2Swap/RawV2Sync. V3Pool/V2Pair contracts are still registered for
# every pool regardless (contractRegister has no entity-store access to check this), so this only
# saves DB writes, not HyperSync fetch volume — see EventHandlers.ts's contractRegister comments.
type RelevantPool {
  id: ID! # `${chainId}-${address}`, lowercase
  chainId: Int!
  address: String!
}

type RawLaunch @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  tokenAddress: String!
  deployerAddress: String!
  pairTokenAddress: String!
  poolAddress: String!
  # The V1 factory contract that emitted this launch (PonsV1LegacyFactory or PonsV1ActiveFactory —
  # both share this entity since the event shape is identical; the sync layer uses this to attribute
  # each row to the right be/src/launchpads/pons/sourceRegistry.ts FactorySource).
  factoryAddress: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}

type RawSwap @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  poolAddress: String!
  # The transaction's originating EOA (tx.from), not the Swap event's own `sender` param — on a
  # router-mediated swap `sender` is typically the router contract, not the wallet that traded. See
  # be/src/domain/types.ts's Trade.traderAddress doc comment for the same distinction.
  txFrom: String!
  amount0: BigInt!
  amount1: BigInt!
  sqrtPriceX96: BigInt!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
  timestamp: Int!
}

type RawLaunchV2 @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  tokenAddress: String!
  curveAddress: String!
  deployerAddress: String!
  pairTokenAddress: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}

type RawLifecycleTransition @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  tokenAddress: String!
  phase: Int!
  kind: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}

type RawCurveTrade @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  curveAddress: String!
  side: String!
  tokenAmountRaw: BigInt!
  quoteAmountRaw: BigInt!
  feeRaw: BigInt!
  taxRaw: BigInt!
  txFrom: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
  timestamp: Int!
}

type RawCurveBuyback @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  curveAddress: String!
  quoteSpentRaw: BigInt!
  tokensLockedRaw: BigInt!
  # BuybackLocked has no buyer/trader param at all — this is the transaction's originating EOA
  # (tx.from), the same provenance RawCurveTrade.txFrom uses, not a made-up value.
  txFrom: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
  timestamp: Int!
}

type RawV4Initialize @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  poolId: String!
  currency0: String!
  currency1: String!
  fee: Int!
  tickSpacing: Int!
  hooks: String!
  sqrtPriceX96: BigInt!
  tick: Int!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}

type RawV4Swap @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  poolId: String!
  # `sender` distinguishes a hook-initiated swap (protocol activity) from a user swap — NOT the
  # trader. See envio/schema.graphql's RawSwap.txFrom comment for why: same distinction as V1/V2.
  sender: String!
  txFrom: String!
  amount0: BigInt!
  amount1: BigInt!
  sqrtPriceX96: BigInt!
  liquidity: BigInt!
  tick: Int!
  fee: Int!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
  timestamp: Int!
}

# Global V3/V2 factory registrations. These rows are raw evidence only; the app DB
# promotes them after independent identity checks and source parity.
type RawV3PoolCreated @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  factoryAddress: String!
  poolAddress: String!
  token0: String!
  token1: String!
  fee: Int!
  tickSpacing: Int!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}
type RawV3Swap @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  poolAddress: String!
  txFrom: String!
  sender: String!
  amount0: BigInt!
  amount1: BigInt!
  sqrtPriceX96: BigInt!
  fee: Int!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
  timestamp: Int!
}
type RawV2PairCreated @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  factoryAddress: String!
  pairAddress: String!
  token0: String!
  token1: String!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}
type RawV2Swap @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]]) {
  id: ID!
  chainId: Int!
  pairAddress: String!
  txFrom: String!
  sender: String!
  amount0In: BigInt!
  amount1In: BigInt!
  amount0Out: BigInt!
  amount1Out: BigInt!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
  timestamp: Int!
}
type RawV2Sync @index(fields: ["chainId", ["blockNumber", "ASC"], ["logIndex", "ASC"]])
  @index(fields: ["chainId", "pairAddress", "txHash", ["logIndex", "DESC"]]) {
  id: ID!
  chainId: Int!
  pairAddress: String!
  reserve0: BigInt!
  reserve1: BigInt!
  blockNumber: BigInt!
  blockHash: String!
  txHash: String!
  logIndex: Int!
}
