services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: launchpad
      POSTGRES_PASSWORD: launchpad_local
      POSTGRES_DB: launchpad_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pons_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpad -d launchpad_test"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pons_pg_data:
